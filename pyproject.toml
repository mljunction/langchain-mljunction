[project]
name = "langchain-mljunction"
version = "0.1.0"
description = "Native LangChain integration for the ML Junction gateway"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "httpx>=0.27,<1",
    "langchain-core>=0.3.70,<2",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
test = [
    "langchain-tests>=1.1.9,<2",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_mljunction"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
