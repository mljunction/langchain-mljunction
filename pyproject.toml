[project]
name = "langchain-mljunction"
version = "0.1.1"
description = "Native LangChain integration for the ML Junction gateway"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ML Junction", email = "mail@mljunction.com" }]
keywords = ["langchain", "llm", "llm-router", "llm-gateway", "mljunction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27,<1",
    "langchain-core>=0.3.70,<2",
    "pydantic>=2.9,<3",
]

[project.urls]
Homepage = "https://mljunction.com"
Repository = "https://github.com/mljunction/langchain-mljunction"
Issues = "https://github.com/mljunction/langchain-mljunction/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
]
test = [
    "langchain-tests>=1.1.9,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
    "opentelemetry-sdk>=1.36,<2",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

# `test` above stays a published extra so consumers can install it. This group
# is what `uv sync` installs by default, so a fresh checkout can run pytest
# without knowing to pass --extra test; without it, tests/test_tracer.py fails
# at collection with ModuleNotFoundError: opentelemetry.
[dependency-groups]
dev = [
    "langchain-mljunction[test]",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_mljunction"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
